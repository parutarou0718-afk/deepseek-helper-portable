<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在启动 DeepSeek 助手</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e8eaed;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .card { text-align: center; padding: 40px; max-width: 460px; }
  .spinner {
    width: 54px; height: 54px; margin: 0 auto 26px;
    border: 5px solid rgba(255,255,255,.14);
    border-top-color: #4d7cfe; border-radius: 50%;
    animation: spin .85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; letter-spacing: .5px; }
  #status { font-size: 14px; color: #9aa3ad; margin: 0; min-height: 20px; }
  .foot { margin-top: 34px; font-size: 13px; color: #5b6470; line-height: 1.8; }
  .foot a { color: #4d7cfe; text-decoration: none; }
  .warn { color: #e0a458; display: none; margin-top: 10px; font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>正在启动 DeepSeek 助手…</h1>
    <p id="status">正在初始化服务，请稍候</p>
    <div class="foot">
      若长时间未自动跳转，<a id="manual" href="http://127.0.0.1:3080/">点此直接打开</a>
      <div class="warn" id="warn">
        启动时间偏长。若仍未打开，请关闭本页后重新双击启动程序；<br>
        或查看解压目录里的 <b>dsh.log</b> 排查。
      </div>
    </div>
  </div>

<script>
(function () {
  var TARGET = 'http://127.0.0.1:3080/';
  var start = Date.now();
  var statusEl = document.getElementById('status');
  var warnEl = document.getElementById('warn');
  var SLOW_MS = 60000; // 60 秒后提示异常

  function elapsedSec() {
    return Math.floor((Date.now() - start) / 1000);
  }
  function tick() {
    var s = elapsedSec();
    statusEl.textContent = '正在初始化服务，请稍候（已等待 ' + s + ' 秒）';
    if (Date.now() - start > SLOW_MS) { warnEl.style.display = 'block'; }
  }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function probe() {
    while (true) {
      try {
        // no-cors：只要能拿到响应（哪怕 opaque）就说明服务已就绪
        await fetch(TARGET, { mode: 'no-cors', cache: 'no-store' });
        window.location.replace(TARGET);
        return;
      } catch (e) {
        // 网络错误 = 服务还没起来，继续轮询
        // SecurityError = fetch 被 file:// 环境限制，退化为定时跳转
        if (e && e.name === 'SecurityError') {
          var s = elapsedSec();
          if (s >= 3) { window.location.replace(TARGET); return; }
        }
      }
      tick();
      await delay(500);
    }
  }

  tick();
  probe();
})();
</script>
</body>
</html>
